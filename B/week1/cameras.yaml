# Town06 직선 본선 구간의 다중 CCTV 위치 설정.
#
# 작업 순서:
#   1. spectator_watch.py로 spectator 좌표를 확인
#   2. 아래 location/rotation 값을 실제 좌표로 교체
#   3. camera_test_capture.py 실행하여 PNG 확인
#   4. 필요하면 yaw, pitch를 5~10도 단위로 조정 후 재캡처
#
# 좌표계:
#   - location: (x, y, z) 미터 단위
#   - rotation: (pitch, yaw, roll) 도 단위
#   - CARLA의 yaw 기준: +X축이 0도, +Y축이 90도
#   - 차량이 +X 방향으로 진행 → 카메라 yaw=180 (차량을 마주봄)

map: Town06
fov: 90
image_size: [1920, 1080]

cameras:
  - id: cam0
    location: {x: 437.64, y: -17.54, z: 13.25}
    rotation: {pitch: -17.72, yaw: -0.28, roll: 0.0}

  - id: cam1
    location: {x: 312.21, y: -18.09, z: 11.21}
    rotation: {pitch: -14.44, yaw: 3.49, roll: 0.0}

  - id: cam2
    location: {x: 219.30, y: -17.80, z: 11.14}
    rotation: {pitch: -17.14, yaw: 1.36, roll: 0.0}

notes: |
  진행 방향: -X (cam0 -> cam1 -> cam2 순서로 차량이 통과하도록 배치)
  카메라 간격: 약 120m (100~150m 범위 권장)
  높이: 8m (한국 CCTV 갠트리 기준)
  옆 갓길에서 약 5m 떨어진 위치를 가정
